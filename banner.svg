<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0813"/>
      <stop offset="50%" stop-color="#120e24"/>
      <stop offset="100%" stop-color="#040307"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="12" fill="url(#bgGrad)" stroke="#1e1838" stroke-width="1.5"/>

  <!-- Tech grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="220" />
    <line x1="200" y1="0" x2="200" y2="220" />
    <line x1="300" y1="0" x2="300" y2="220" />
    <line x1="400" y1="0" x2="400" y2="220" />
    <line x1="500" y1="0" x2="500" y2="220" />
    <line x1="600" y1="0" x2="600" y2="220" />
    <line x1="700" y1="0" x2="700" y2="220" />
    <line x1="800" y1="0" x2="800" y2="220" />
    
    <line x1="0" y1="55" x2="900" y2="55" />
    <line x1="0" y1="110" x2="900" y2="110" />
    <line x1="0" y1="165" x2="900" y2="165" />
  </g>

  <!-- Accent glow line on the left -->
  <rect x="0" y="30" width="5" height="160" rx="2.5" fill="url(#accentGrad)" />

  <!-- Main Name -->
  <text x="60" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="1.5">Rajat Shriram</text>

  <!-- Subtitle -->
  <text x="60" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">Systems &amp; Backend Infrastructure Engineer</text>
  
  <!-- Subtext -->
  <text x="60" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" font-style="italic">Building highly available, resilient, and observable distributed infrastructure.</text>

  <!-- Core Pillars Badges -->
  <!-- Pillar 1 -->
  <g transform="translate(630, 45)">
    <rect width="210" height="32" rx="6" fill="#16122e" stroke="#2a2359" stroke-width="1"/>
    <circle cx="20" cy="16" r="4.5" fill="#a78bfa"/>
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc">Distributed Systems</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(630, 95)">
    <rect width="210" height="32" rx="6" fill="#0a1d37" stroke="#143765" stroke-width="1"/>
    <circle cx="20" cy="16" r="4.5" fill="#60a5fa"/>
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#93c5fd">API Gateways &amp; Network</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(630, 145)">
    <rect width="210" height="32" rx="6" fill="#27180c" stroke="#4a2d18" stroke-width="1"/>
    <circle cx="20" cy="16" r="4.5" fill="#f59e0b"/>
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fcd34d">DevOps &amp; Observability</text>
  </g>
</svg>
